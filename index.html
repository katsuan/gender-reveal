<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>👶 ベビーの性別発表</title>
<meta name="description" content="男の子？女の子？プレゼントを開けて確かめてね🎁">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ベビーの性別発表">
<meta property="og:title" content="👶 ベビーの性別発表">
<meta property="og:description" content="男の子？女の子？プレゼントを開けて確かめてね🎁">
<meta property="og:url" content="https://katsuan.github.io/gender-reveal/">
<meta property="og:image" content="https://katsuan.github.io/gender-reveal/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">

<meta name="theme-color" content="#f3ecff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== 色・サイズはここで一括管理 ===== */
  :root {
    --boy: #5aa9e6;
    --boy-deep: #2f7fc0;
    --girl: #f48fb1;
    --girl-deep: #d9557f;
    --gold: #f5c542;
    --gold-deep: #c98a00;
    --bg-top: #fff8f0;
    --bg-bottom: #f3ecff;
    --ink: #3d3450;
    --ink-soft: #7a7090;
    --card: rgba(255, 255, 255, 0.82);
    --card-border: rgba(255, 255, 255, 0.95);
    --shadow: 0 10px 30px rgba(90, 70, 130, 0.14);
    --radius-lg: 28px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --gap: 16px;
    --max-w: 440px;
    --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    --reveal: var(--gold); /* 発表後に boy/girl に切り替わる */
    --reveal-deep: var(--gold);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body.revealed { background: linear-gradient(180deg, #fff, color-mix(in srgb, var(--reveal) 28%, #fff)); }

  .wrap {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 28px 16px 48px;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    position: relative;
    z-index: 2;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 22px 20px;
    backdrop-filter: blur(8px);
  }

  /* ===== ヘッダー ===== */
  .hero { text-align: center; padding-top: 8px; }
  .hero .eyebrow {
    font-size: 12px; letter-spacing: .25em; color: var(--ink-soft); text-transform: uppercase;
  }
  .hero h1 {
    font-size: 30px; font-weight: 800; margin: 6px 0 4px; line-height: 1.3;
    background: linear-gradient(90deg, var(--boy), var(--girl));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .names { font-size: 15px; color: var(--ink-soft); }
  .question {
    display: inline-flex; gap: 10px; margin-top: 14px; align-items: center; font-weight: 800; font-size: 20px;
  }
  .question .b { color: var(--boy); } .question .g { color: var(--girl); }
  .question .or { font-size: 13px; color: var(--ink-soft); font-weight: 400; }

  /* ===== カウントダウン ===== */
  .label { font-size: 13px; color: var(--ink-soft); text-align: center; margin-bottom: 12px; }
  .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cd-cell {
    background: #fff; border-radius: var(--radius-md); padding: 12px 4px; text-align: center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
  }
  .cd-num { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .cd-unit { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .cd-done { text-align: center; font-size: 18px; font-weight: 700; }

  /* 妊娠週数プログレス */
  .progress { margin-top: 16px; }
  .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
  .bar { height: 12px; border-radius: 99px; background: #eee6f5; overflow: hidden; position: relative; }
  .bar-fill {
    height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, var(--boy), var(--girl));
    transition: width 1.4s cubic-bezier(.2,.8,.2,1);
  }
  .bar-baby {
    position: absolute; top: -9px; font-size: 20px; transform: translateX(-50%);
    transition: left 1.4s cubic-bezier(.2,.8,.2,1);
  }

  /* ===== カレンダー ===== */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font-weight: 800; font-size: 17px; }
  .cal-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none; background: #fff; color: var(--ink);
    font-size: 16px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-dow { font-size: 11px; color: var(--ink-soft); padding: 4px 0; }
  .cal-dow:first-child { color: var(--girl-deep); } .cal-dow:last-child { color: var(--boy-deep); }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 14px;
    border-radius: var(--radius-sm); position: relative; font-variant-numeric: tabular-nums;
  }
  .cal-day.muted { color: #cfc8da; }
  .cal-day.past { color: #b8b0c6; }
  .cal-day.today { box-shadow: inset 0 0 0 2px var(--ink-soft); font-weight: 700; }
  .cal-day.reveal-day { background: color-mix(in srgb, var(--gold) 35%, #fff); font-weight: 700; }
  .cal-day.due {
    background: linear-gradient(135deg, var(--boy), var(--girl)); color: #fff; font-weight: 800;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .cal-day.due::after { content: "👶"; position: absolute; top: -8px; right: -4px; font-size: 13px; }
  .cal-legend { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .legend-btn {
    font-family: inherit; font-size: 12px; color: var(--ink-soft); cursor: pointer;
    background: #fff; border: 1px solid #ebe4f3; border-radius: 99px; padding: 6px 12px;
    display: inline-flex; align-items: center; transition: background .15s, transform .1s;
  }
  .legend-btn:active { transform: scale(.95); background: #f6f1fb; }
  .legend-btn.current { border-color: var(--ink-soft); color: var(--ink); font-weight: 700; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .dot.due { background: linear-gradient(135deg, var(--boy), var(--girl)); }
  .dot.today { box-shadow: inset 0 0 0 2px var(--ink-soft); }
  .dot.rv { background: color-mix(in srgb, var(--gold) 50%, #fff); }

  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  /* ===== 発表ボタン ===== */
  .reveal-card { border: 2px solid color-mix(in srgb, var(--girl) 35%, var(--boy)); }
  .cta {
    width: 100%; border: none; border-radius: 99px; padding: 18px; font-family: inherit;
    font-size: 18px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(90deg, var(--boy), var(--girl));
    box-shadow: 0 8px 20px rgba(200, 120, 180, .35);
    animation: glow 2.4s ease-in-out infinite;
  }
  .cta:disabled { background: #cfc8da; box-shadow: none; animation: none; cursor: not-allowed; }
  @keyframes glow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .lock-note { text-align: center; font-size: 13px; color: var(--ink-soft); margin-top: 10px; }
  .sound-toggle {
    display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px;
    color: var(--ink-soft); margin-top: 10px; cursor: pointer; user-select: none;
  }

  /* ===== 演出ステージ(全画面) ===== */
  .stage {
    position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 40%, #fff 0%, var(--bg-bottom) 70%);
  }
  .stage.show { display: flex; }
  .stage.dark { background: radial-gradient(circle at 50% 45%, #2a2340 0%, #0f0b1a 75%); color: #fff; transition: background .6s; }

  .hint { font-size: 16px; color: var(--ink-soft); margin-top: 26px; min-height: 1.5em; font-weight: 700; }
  .stage.dark .hint { color: #cfc6e8; }
  .taps { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .tap-dot { width: 10px; height: 10px; border-radius: 50%; background: #e3dcef; transition: background .2s, transform .2s; }
  .tap-dot.on { background: linear-gradient(135deg, var(--boy), var(--girl)); transform: scale(1.3); }

  /* ギフトボックス(🎁絵文字) */
  .gift {
    position: relative; width: 240px; height: 240px; cursor: pointer; user-select: none; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
    --grow: 1;
  }
  .gift-emoji {
    font-size: 170px; line-height: 1; position: relative; z-index: 1;
    transform: scale(var(--grow)); transition: transform .25s cubic-bezier(.3,1.8,.5,1), opacity .5s;
    filter: drop-shadow(0 14px 18px rgba(90, 60, 120, .22));
  }
  .gift.idle .gift-emoji { animation: invite 1.6s ease-in-out infinite; }
  /* タップを促す波紋 */
  .gift::before, .gift::after {
    content: ""; position: absolute; inset: 30px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--girl) 55%, var(--boy));
    opacity: 0; animation: ring 2s ease-out infinite;
  }
  .gift::after { animation-delay: 1s; }
  .gift.busy::before, .gift.busy::after { animation: none; opacity: 0; }
  /* 指アイコン */
  .finger {
    position: absolute; right: 10px; bottom: 6px; font-size: 48px; z-index: 2; pointer-events: none;
    animation: poke 1.2s ease-in-out infinite; transition: opacity .3s;
  }
  .gift:not(.idle) .finger { opacity: 0; }
  /* タップ時のキラキラ */
  .spark { position: absolute; z-index: 3; pointer-events: none; font-size: 22px; animation: spark .7s ease-out forwards; }
  .gift.shake-1 { animation: shake .35s; }
  .gift.shake-2 { animation: shake .3s 2; }
  .gift.shake-3 { animation: shakeBig .25s 3; }
  .gift.open .gift-emoji { transform: scale(2.2); opacity: 0; transition: transform .6s ease-in, opacity .6s ease-in; }
  .remain { font-size: 13px; color: var(--ink-soft); margin-top: 6px; min-height: 1.4em; }
  .remain b { color: var(--girl-deep); font-size: 16px; }

  @keyframes invite { 0%,100% { transform: scale(1) rotate(0); } 10% { transform: scale(1.05) rotate(-4deg); } 20% { transform: scale(1.05) rotate(4deg); } 30% { transform: scale(1) rotate(0); } }
  @keyframes ring { 0% { transform: scale(.7); opacity: .7; } 100% { transform: scale(1.25); opacity: 0; } }
  @keyframes poke { 0%,100% { transform: translate(0, 0); } 50% { transform: translate(-10px, -12px); } }
  @keyframes spark { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity: 0; } }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  @keyframes shakeBig {
    0%,100% { transform: rotate(0) scale(1); } 20% { transform: rotate(-12deg) scale(1.05); }
    60% { transform: rotate(12deg) scale(1.08); }
  }



  /* ハートビート */
  .heart { font-size: 90px; display: none; animation: beat 1s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(255,120,160,.6)); }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.18); } }

  /* 結果 */
  .result { display: none; flex-direction: column; align-items: center; gap: 12px; }
  .result.show { display: flex; }
  .result .it { font-size: 18px; color: var(--ink-soft); letter-spacing: .15em; animation: fadeUp .8s both; }
  .result .answer {
    font-size: 64px; font-weight: 800; color: var(--reveal-deep); line-height: 1.15;
    animation: zoomIn 1s cubic-bezier(.2,1.6,.4,1) both .2s;
    text-shadow: 0 6px 24px color-mix(in srgb, var(--reveal) 50%, transparent);
  }
  .result .answer.long { font-size: 40px; }
  .result .emoji.many { font-size: 52px; white-space: nowrap; }
  .result .emoji { font-size: 72px; animation: zoomIn 1s cubic-bezier(.2,1.6,.4,1) both .5s; }
  .result .baby-name { font-size: 20px; font-weight: 700; color: var(--reveal-deep); animation: fadeUp .8s both .9s; }
  .result .msg { font-size: 15px; line-height: 1.8; color: var(--ink); max-width: 340px; white-space: pre-wrap; animation: fadeUp .8s both 1.2s; }
  .result .actions { display: flex; gap: 10px; margin-top: 12px; animation: fadeUp .8s both 1.6s; }
  .pill {
    border: none; border-radius: 99px; padding: 12px 20px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    background: #fff; color: var(--reveal-deep); box-shadow: 0 4px 12px rgba(0,0,0,.1);
  }
  .pill.primary { background: var(--reveal); color: #fff; }
  @keyframes zoomIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fadeUp { 0% { transform: translateY(16px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

  /* 背景の浮遊バルーン */
  .floaters { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .floater { position: absolute; bottom: -80px; font-size: 32px; opacity: .55; animation: floatUp linear infinite; }
  @keyframes floatUp { 0% { transform: translateY(0) rotate(0); } 100% { transform: translateY(-120vh) rotate(25deg); } }

  canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  /* 合言葉モーダル */
  .modal { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(40, 30, 60, .45); backdrop-filter: blur(4px); }
  .modal.show { display: flex; }
  .modal-box { width: 100%; max-width: 360px; background: #fff; border-radius: var(--radius-lg); padding: 24px 20px; text-align: center; box-shadow: var(--shadow); }
  .modal-box.shake-1 { animation: shake .35s 2; }
  .modal-box h2 { font-size: 18px; margin-bottom: 6px; }
  .modal-box p { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }
  .modal-box input { width: 100%; font-family: inherit; font-size: 18px; text-align: center; padding: 12px; border-radius: var(--radius-md); border: 2px solid #e6def0; margin-bottom: 8px; }
  .modal-box input:focus { outline: none; border-color: var(--girl); }
  .pass-err { font-size: 13px; color: var(--girl-deep); min-height: 1.4em; margin-bottom: 8px; }
  .modal-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  .modal-actions .pill { color: var(--ink-soft); }
  .modal-actions .pill.primary { background: linear-gradient(90deg, var(--boy), var(--girl)); color: #fff; }

  /* エラー / 未設定 */
  .empty { text-align: center; line-height: 1.8; font-size: 14px; }
  .empty a { color: var(--girl-deep); font-weight: 700; }

  .footer { text-align: center; font-size: 12px; color: var(--ink-soft); }
  .footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="floaters" id="floaters" aria-hidden="true"></div>

<main class="wrap" id="main">
  <section class="hero">
    <div class="eyebrow">Gender Reveal</div>
    <h1 id="title">ベビーの性別発表</h1>
    <div class="names" id="names"></div>
    <div class="question"><span class="b">👦 男の子</span><span class="or">or</span><span class="g">女の子 👧</span></div>
  </section>

  <section class="card reveal-card">
    <div class="label" id="revealLabel">👇 ボタンを押して発表を見てね</div>
    <div id="revealCountdown"></div>
    <button class="cta" id="startBtn">🎁 性別を発表する</button>
    <div class="lock-note" id="lockNote"></div>
    <label class="sound-toggle"><input type="checkbox" id="soundOn" checked> 🔊 効果音あり</label>
  </section>

  <section class="card" id="dueCard">
    <div class="label" id="dueLabel">出産予定日まで</div>
    <div id="dueCountdown"></div>
    <div class="progress" id="progress">
      <div class="progress-meta"><span id="weekText"></span><span>40週</span></div>
      <div class="bar"><div class="bar-fill" id="barFill"></div><div class="bar-baby" id="barBaby">🤰</div></div>
    </div>
  </section>

  <section class="card">
    <div class="cal-head">
      <button class="cal-btn" id="calPrev" aria-label="前の月">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button class="cal-btn" id="calNext" aria-label="次の月">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <button type="button" class="legend-btn" id="legendDue"><i class="dot due"></i>予定日</button>
      <button type="button" class="legend-btn" id="legendToday"><i class="dot today"></i>今日</button>
      <button type="button" class="legend-btn" id="legendReveal"><i class="dot rv"></i>発表日</button>
    </div>
  </section>


  <div class="footer"><a href="create.html">自分用の発表ページを作る</a></div>
</main>

<!-- 演出ステージ -->
<div class="stage" id="stage" aria-live="polite">
  <div class="gift idle" id="gift" role="button" aria-label="プレゼントをタップ">
    <span class="gift-emoji">🎁</span>
    <span class="finger">👆</span>
  </div>
  <div class="hint" id="hint">プレゼントをタップしてね</div>
  <div class="remain" id="remain"></div>
  <div class="heart" id="heart">💓</div>
  <div class="taps" id="taps"></div>
  <div class="result" id="result">
    <div class="it" id="lead">IT'S A…</div>
    <div class="answer" id="answer"></div>
    <div class="emoji" id="answerEmoji"></div>
    <div class="baby-name" id="babyName"></div>
    <div class="msg" id="msg"></div>
    <div class="actions">
      <button class="pill" id="replayBtn">トップに戻る</button>
      <button class="pill primary" id="shareBtn">シェア</button>
    </div>
  </div>
</div>

<div class="modal" id="passModal">
  <form class="modal-box" id="passBox">
    <h2>🔑 合言葉を入力</h2>
    <p>パパ・ママから聞いた合言葉を入れてね</p>
    <input id="passInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="pass-err" id="passErr"></div>
    <div class="modal-actions">
      <button type="button" class="pill" id="passCancel">戻る</button>
      <button type="submit" class="pill primary">発表へ</button>
    </div>
  </form>
</div>

<canvas id="confetti"></canvas>

<script>
(() => {
  "use strict";

  /* ================= 設定 ================= */
  const DEFAULT_TAPS = 5, MAX_TAPS = 20;
  const PREGNANCY_DAYS = 280;
  // lead: 発表直前の一言 / label: 発表テキスト
  const GENDERS = {
    boy:            { lead: "IT'S A…",     label: "男の子",         emoji: "👦💙",   color: "--boy",  deep: "--boy-deep" },
    girl:           { lead: "IT'S A…",     label: "女の子",         emoji: "👧🩷",   color: "--girl", deep: "--girl-deep" },
    "twins-boys":   { lead: "IT'S TWINS…", label: "男の子ふたり！", emoji: "👦👦💙", color: "--boy",  deep: "--boy-deep" },
    "twins-girls":  { lead: "IT'S TWINS…", label: "女の子ふたり！", emoji: "👧👧🩷", color: "--girl", deep: "--girl-deep" },
    "twins-mixed":  { lead: "IT'S TWINS…", label: "男の子と女の子！", emoji: "👦💙👧🩷", color: "--gold", deep: "--gold-deep" },
    twins:          { lead: "なんと…",     label: "双子ちゃん！",   emoji: "👶👶",   color: "--gold", deep: "--gold-deep" },
    surprise:       { lead: "IT'S…",       label: "ヒミツ！",       emoji: "🤫✨",   color: "--gold", deep: "--gold-deep" },
  };
  const ALIASES = { m: "boy", male: "boy", 男: "boy", 男の子: "boy", f: "girl", female: "girl", 女: "girl", 女の子: "girl" };

  /* ============ パラメータ読み込み ============ */
  // 平文: ?gender=girl&due=2027-02-14&reveal=2026-10-01T19:00&mom=花子&dad=太郎&name=ひな&msg=...
  // 公開情報: ?d=<base64url(JSON)>  予定日・名前など
  // 秘密情報: ?s=<AES-GCM暗号文>  性別・赤ちゃんの名前・メッセージ (create.html で生成)
  function b64urlDecode(str) {
    const b64 = str.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((str.length + 3) % 4);
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }
  function readParams() {
    const q = new URLSearchParams(location.search);
    let p = {};
    if (q.get("d")) {
      try { p = JSON.parse(b64urlDecode(q.get("d"))); } catch (e) { console.warn("d の解析に失敗", e); }
    }
    for (const [k, v] of q.entries()) if (k !== "d" && k !== "s" && !(k in p)) p[k] = v;
    p.secret = q.get("s") || null; // 暗号化された性別データ
    normalizeGender(p);
    return p;
  }
  function normalizeGender(p) {
    const g = String(p.gender || p.g || "").trim().toLowerCase();
    p.gender = GENDERS[g] ? g : (ALIASES[g] || null);
    if (!p.gender && (g === "custom" || (g && p.label))) p.gender = "custom"; // カスタム
  }
  const P = readParams();
  // タップ回数(?taps=) 1〜20、未指定は5
  const TAPS_TO_OPEN = Math.min(MAX_TAPS, Math.max(1, parseInt(P.taps, 10) || DEFAULT_TAPS));

  /* ============ 復号(AES-GCM) ============ */
  // s = v1.<salt>.<iv>.<ciphertext>[.<key>]  key が無ければ合言葉モード
  const b64urlToBytes = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
  const secretParts = P.secret ? P.secret.split(".") : null;
  const needsPass = !!secretParts && !secretParts[4];
  async function decryptSecret(pass) {
    const [ver, salt, iv, ct, key] = secretParts;
    if (ver !== "v1") throw new Error("unsupported");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(key || pass), "PBKDF2", false, ["deriveKey"]);
    const aes = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64urlToBytes(salt), iterations: 150000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64urlToBytes(iv) }, aes, b64urlToBytes(ct));
    const data = JSON.parse(new TextDecoder().decode(plain));
    delete data.pad;
    Object.assign(P, data);
    normalizeGender(P);
    P.secret = null;
  }

  function parseDate(s) {
    if (!s) return null;
    const d = new Date(/T/.test(s) ? s : s + "T00:00:00");
    return isNaN(d) ? null : d;
  }
  const due = parseDate(P.due);
  const revealAt = parseDate(P.reveal);

  /* ============ ユーティリティ ============ */
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const cssVar = n => getComputedStyle(root).getPropertyValue(n).trim();
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const pad = n => String(n).padStart(2, "0");
  const fmtDate = d => `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // カスタム色
  if (P.boyColor) root.style.setProperty("--boy", P.boyColor);
  if (P.girlColor) root.style.setProperty("--girl", P.girlColor);

  /* ============ ヘッダー ============ */
  if (P.title) $("title").textContent = P.title;
  const parents = [P.dad, P.mom].filter(Boolean);
  $("names").textContent = parents.length ? `${parents.join(" & ")} ファミリー` : "";

  /* ============ カウントダウン ============ */
  function diffParts(target) {
    let ms = Math.max(0, target - Date.now());
    const d = Math.floor(ms / 864e5); ms -= d * 864e5;
    const h = Math.floor(ms / 36e5); ms -= h * 36e5;
    const m = Math.floor(ms / 6e4); ms -= m * 6e4;
    const s = Math.floor(ms / 1e3);
    return { d, h, m, s, done: target - Date.now() <= 0 };
  }
  function renderCountdown(el, target, doneText) {
    const p = diffParts(target);
    if (p.done) { el.innerHTML = `<div class="cd-done">${doneText}</div>`; return true; }
    el.innerHTML = `<div class="countdown">
      <div class="cd-cell"><div class="cd-num">${p.d}</div><div class="cd-unit">日</div></div>
      <div class="cd-cell"><div class="cd-num">${pad(p.h)}</div><div class="cd-unit">時間</div></div>
      <div class="cd-cell"><div class="cd-num">${pad(p.m)}</div><div class="cd-unit">分</div></div>
      <div class="cd-cell"><div class="cd-num">${pad(p.s)}</div><div class="cd-unit">秒</div></div></div>`;
    return false;
  }

  function renderProgress() {
    if (!due) { $("progress").style.display = "none"; return; }
    const start = new Date(due.getTime() - PREGNANCY_DAYS * 864e5);
    const elapsed = Math.floor((Date.now() - start) / 864e5);
    const ratio = Math.min(1, Math.max(0, elapsed / PREGNANCY_DAYS));
    const w = Math.floor(elapsed / 7), dd = elapsed % 7;
    $("weekText").textContent = elapsed < 0 ? "" : (elapsed >= PREGNANCY_DAYS ? "予定日を迎えました 🎉" : `いま 妊娠${w}週${dd}日`);
    requestAnimationFrame(() => {
      $("barFill").style.width = (ratio * 100) + "%";
      $("barBaby").style.left = Math.min(96, Math.max(4, ratio * 100)) + "%";
    });
  }

  function tick() {
    if (due) {
      $("dueLabel").textContent = `出産予定日 ${fmtDate(due)} まで`;
      renderCountdown($("dueCountdown"), due, "予定日を迎えました 👶🎉");
    } else {
      $("dueCard").style.display = "none";
    }
    updateLock();
  }

  /* ============ 発表ロック ============ */
  function updateLock() {
    const btn = $("startBtn");
    if (!P.gender && !P.secret) {
      btn.disabled = true;
      $("revealLabel").textContent = "";
      $("revealCountdown").innerHTML = "";
      $("lockNote").innerHTML = `性別が設定されていません。<br><a href="create.html" style="color:var(--girl-deep);font-weight:700">作成ページ</a>からURLを作ってください`;
      return;
    }
    if (revealAt && revealAt > Date.now()) {
      btn.disabled = true;
      $("revealLabel").textContent = `発表は ${fmtDate(revealAt)} ${pad(revealAt.getHours())}:${pad(revealAt.getMinutes())} から`;
      renderCountdown($("revealCountdown"), revealAt, "");
      $("revealCountdown").style.marginBottom = "14px";
      $("lockNote").textContent = "🔒 お楽しみに…！";
    } else {
      btn.disabled = false;
      $("revealLabel").textContent = revealAt ? "🎉 発表の時間です！" : "👇 ボタンを押して発表を見てね";
      $("revealCountdown").innerHTML = "";
      $("revealCountdown").style.marginBottom = "0";
      $("lockNote").textContent = "";
    }
  }

  /* ============ カレンダー ============ */
  const today = new Date();
  let calY, calM;
  const initCal = due || today;
  calY = initCal.getFullYear(); calM = initCal.getMonth();
  if (!revealAt) $("legendReveal").style.display = "none";

  function renderCal() {
    $("calTitle").textContent = `${calY}年 ${calM + 1}月`;
    const grid = $("calGrid");
    const dows = ["日", "月", "火", "水", "木", "金", "土"];
    let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join("");
    const first = new Date(calY, calM, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(calY, calM + 1, 0).getDate();
    const prevDays = new Date(calY, calM, 0).getDate();
    const cells = Math.ceil((startDow + daysInMonth) / 7) * 7;
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    for (let i = 0; i < cells; i++) {
      const dayNum = i - startDow + 1;
      if (dayNum < 1 || dayNum > daysInMonth) {
        const n = dayNum < 1 ? prevDays + dayNum : dayNum - daysInMonth;
        html += `<div class="cal-day muted">${n}</div>`;
        continue;
      }
      const d = new Date(calY, calM, dayNum);
      const cls = ["cal-day"];
      if (d < todayMid) cls.push("past");
      if (sameDay(d, today)) cls.push("today");
      if (revealAt && sameDay(d, revealAt)) cls.push("reveal-day");
      if (due && sameDay(d, due)) cls.push("due");
      html += `<div class="${cls.join(" ")}">${dayNum}</div>`;
    }
    grid.innerHTML = html;
    const inView = d => d && d.getFullYear() === calY && d.getMonth() === calM;
    $("legendToday").classList.toggle("current", inView(today));
    $("legendDue").classList.toggle("current", inView(due));
    $("legendReveal").classList.toggle("current", inView(revealAt));
  }
  $("calPrev").onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); };
  $("calNext").onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); };
  // 凡例タップでその日の月へジャンプ
  const jumpTo = d => { calY = d.getFullYear(); calM = d.getMonth(); renderCal(); };
  $("legendToday").onclick = () => jumpTo(today);
  $("legendDue").onclick = () => due && jumpTo(due);
  $("legendReveal").onclick = () => revealAt && jumpTo(revealAt);
  if (!due) $("legendDue").style.display = "none";

  /* ============ 背景バルーン ============ */
  (function floaters() {
    const items = ["🎈", "💙", "🐣", "🩷", "✨", "🍼", "🐣", "🎀", "⭐"];
    const box = $("floaters");
    for (let i = 0; i < 16; i++) {
      const s = document.createElement("span");
      s.className = "floater";
      s.textContent = items[i % items.length];
      s.style.left = Math.random() * 100 + "%";
      s.style.fontSize = 18 + Math.random() * 22 + "px";
      s.style.animationDuration = 12 + Math.random() * 14 + "s";
      s.style.animationDelay = -Math.random() * 20 + "s";
      box.appendChild(s);
    }
  })();

  /* ============ サウンド(Web Audio 合成) ============ */
  let ac = null;
  const soundOn = () => $("soundOn").checked;
  function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; }
  function tone(freq, dur = .15, type = "sine", vol = .2, when = 0) {
    if (!soundOn()) return;
    const c = audio(), t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
  }
  // 心音「ドクン、ドクン」: 低いサイン波の2連打を1秒周期で
  function heartbeat(beats) {
    if (!soundOn()) return;
    const c = audio();
    for (let i = 0; i < beats; i++) {
      [0, 0.18].forEach((off, k) => {
        const t = c.currentTime + i * 1.0 + off;
        const o = c.createOscillator(), g = c.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(k ? 70 : 85, t);
        o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(k ? 0.35 : 0.5, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.22);
      });
    }
  }
  function fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, .35, "triangle", .22, i * .12));
    [784, 1047, 1319].forEach(f => tone(f, 1.2, "triangle", .12, .55));
  }

  /* ============ 紙吹雪 ============ */
  const cv = $("confetti"), ctx = cv.getContext("2d");
  let parts = [], raf = null;
  function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  addEventListener("resize", resize); resize();
  function burst(colors, count = 180, origin = { x: innerWidth / 2, y: innerHeight * .45 }) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 9;
      parts.push({
        x: origin.x, y: origin.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
        c: colors[i % colors.length], life: 0, max: 160 + Math.random() * 80, shape: Math.random() < .25 ? "c" : "r",
      });
    }
    if (!raf) loop();
  }
  function rain(colors, secs = 4) {
    const end = Date.now() + secs * 1000;
    (function drop() {
      for (let i = 0; i < 6; i++) parts.push({
        x: Math.random() * innerWidth, y: -20, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3,
        w: 6 + Math.random() * 5, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .2,
        c: colors[Math.floor(Math.random() * colors.length)], life: 0, max: 400, shape: Math.random() < .25 ? "c" : "r",
      });
      if (!raf) loop();
      if (Date.now() < end && stage.classList.contains("show")) setTimeout(drop, 60);
    })();
  }
  function loop() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 40);
    for (const p of parts) {
      p.life++; p.vy += .18; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.min(1, (p.max - p.life) / 40);
      if (p.shape === "c") { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r)));
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : null;
    if (!raf) ctx.clearRect(0, 0, innerWidth, innerHeight);
  }

  /* ============ 演出シーケンス ============ */
  const stage = $("stage"), gift = $("gift");
  let taps = 0, busy = false;

  function resetStage() {
    taps = 0; busy = false;
    stage.className = "stage show";
    gift.className = "gift idle"; gift.style.display = "";
    gift.style.setProperty("--grow", 1);
    $("hint").textContent = "プレゼントをタップしてね";
    $("remain").innerHTML = `あと <b>${TAPS_TO_OPEN}</b> 回タップ`;
    $("remain").style.display = "";
    $("taps").style.display = "";
    $("taps").innerHTML = Array.from({ length: TAPS_TO_OPEN }, () => '<i class="tap-dot"></i>').join("");
    $("heart").style.display = "none";
    $("result").className = "result";
    document.body.classList.remove("revealed");
    root.style.removeProperty("--reveal"); root.style.removeProperty("--reveal-deep");
  }

  // タップ回数に関わらず進み具合に応じてヒントを出す
  const tapHints = ["ん？ 何か入ってる…", "ゴソゴソ…", "もうちょっと！", "ドキドキ…"];
  const hintFor = n => n >= TAPS_TO_OPEN ? "" : tapHints[Math.min(tapHints.length - 1, Math.floor((n - 1) / TAPS_TO_OPEN * tapHints.length))];
  function sparkle(x, y) {
    const r = gift.getBoundingClientRect();
    ["✨", "⭐", "💫", "✨"].forEach((e, i) => {
      const sp = document.createElement("span");
      sp.className = "spark"; sp.textContent = e;
      const a = (Math.PI * 2 * i) / 4 + Math.random() * .6;
      sp.style.left = (x - r.left) + "px"; sp.style.top = (y - r.top) + "px";
      sp.style.setProperty("--dx", Math.cos(a) * 60 + "px");
      sp.style.setProperty("--dy", Math.sin(a) * 60 + "px");
      gift.appendChild(sp);
      setTimeout(() => sp.remove(), 700);
    });
  }
  gift.addEventListener("click", async e => {
    if (busy || taps >= TAPS_TO_OPEN) return;
    taps++;
    gift.classList.remove("idle");
    gift.style.setProperty("--grow", 1 + (taps / TAPS_TO_OPEN) * 0.35); // タップごとに少しずつ膨らむ
    sparkle(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2);
    const left = TAPS_TO_OPEN - taps;
    $("remain").innerHTML = left ? `あと <b>${left}</b> 回タップ` : "";
    document.querySelectorAll(".tap-dot").forEach((d, i) => d.classList.toggle("on", i < taps));
    gift.classList.remove("shake-1", "shake-2", "shake-3"); void gift.offsetWidth;
    gift.classList.add(taps >= TAPS_TO_OPEN ? "shake-3" : taps / TAPS_TO_OPEN < 0.5 ? "shake-1" : "shake-2");
    tone(300 + taps * 90, .12, "square", .08);
    if (navigator.vibrate) navigator.vibrate(30 + taps * 15);
    $("hint").textContent = hintFor(taps);
    if (taps >= TAPS_TO_OPEN) {
      busy = true; gift.classList.add("busy");
      await sleep(750);
      gift.classList.add("open");
      await climax();
    }
  });

  async function climax() {
    await sleep(600);
    // 暗転 + 心音
    stage.classList.add("dark");
    gift.style.display = "none"; $("taps").style.display = "none"; $("remain").style.display = "none";
    $("hint").textContent = "運命の瞬間…";
    $("heart").style.display = "block";
    heartbeat(2);
    await sleep(2000);
    $("heart").style.display = "none";
    $("hint").textContent = "";
    reveal();
  }

  function reveal() {
    const g = GENDERS[P.gender] || { lead: "IT'S…", label: P.label || "？", emoji: P.emoji || "🎉", color: "--gold", deep: "--gold-deep" };
    const color = P.color || cssVar(g.color), deep = P.color || cssVar(g.deep);
    root.style.setProperty("--reveal", color);
    root.style.setProperty("--reveal-deep", deep);
    stage.className = "stage show";
    stage.style.background = `radial-gradient(circle at 50% 40%, #fff 0%, color-mix(in srgb, ${color} 35%, #fff) 80%)`;
    document.body.classList.add("revealed");

    $("lead").textContent = P.lead || g.lead;
    $("answer").textContent = P.label || g.label;
    $("answer").classList.toggle("long", $("answer").textContent.length > 5);
    $("answerEmoji").textContent = P.emoji || g.emoji;
    $("answerEmoji").classList.toggle("many", Array.from($("answerEmoji").textContent).length > 3);
    $("babyName").textContent = P.name || ""; // 入力どおりに表示(「ちゃん」は付けない)
    $("msg").textContent = P.msg || "";
    $("result").classList.add("show");

    const palette = /boy/.test(P.gender) ? [color, deep, "#ffffff", "#bfe3ff", cssVar("--gold")]
      : /girl/.test(P.gender) ? [color, deep, "#ffffff", "#ffd6e5", cssVar("--gold")]
      : [cssVar("--boy"), cssVar("--girl"), cssVar("--gold"), "#fff"];
    fanfare();
    if (navigator.vibrate) navigator.vibrate([100, 50, 200]);
    burst(palette, 220);
    setTimeout(() => burst(palette, 120, { x: innerWidth * .2, y: innerHeight * .6 }), 400);
    setTimeout(() => burst(palette, 120, { x: innerWidth * .8, y: innerHeight * .6 }), 700);
    setTimeout(() => rain(palette, 5), 900);
    busy = false;
  }

  $("startBtn").onclick = async () => {
    if ($("startBtn").disabled) return;
    if (soundOn()) audio().resume?.(); // iOS 対策: ユーザー操作で解禁
    if (P.secret) {
      if (needsPass) { openPass(); return; }
      try { await decryptSecret(); } catch (e) { alert("データを読み込めませんでした。URLを確認してください"); return; }
    }
    stage.style.background = "";
    resetStage();
  };

  /* ============ 合言葉モーダル ============ */
  function openPass() {
    $("passModal").classList.add("show");
    $("passErr").textContent = "";
    $("passInput").value = "";
    setTimeout(() => $("passInput").focus(), 50);
  }
  $("passCancel").onclick = () => $("passModal").classList.remove("show");
  $("passBox").onsubmit = async e => {
    e.preventDefault();
    const box = $("passBox");
    try {
      await decryptSecret($("passInput").value.trim());
      $("passModal").classList.remove("show");
      stage.style.background = "";
      resetStage();
    } catch (_) {
      $("passErr").textContent = "合言葉がちがうみたい…🤔";
      box.classList.remove("shake-1"); void box.offsetWidth; box.classList.add("shake-1");
    }
  };
  // もう一度 → 発表前のトップ(カレンダー)へ戻る
  $("replayBtn").onclick = () => {
    stage.className = "stage";
    stage.style.background = "";
    document.body.classList.remove("revealed");
    root.style.removeProperty("--reveal"); root.style.removeProperty("--reveal-deep");
    parts = [];
    scrollTo({ top: 0, behavior: "smooth" });
  };
  $("shareBtn").onclick = async () => {
    const data = { title: document.title, text: "ベビーの性別発表ページです👶 ドキドキしながら開けてね！", url: location.href };
    try {
      if (navigator.share) await navigator.share(data);
      else { await navigator.clipboard.writeText(location.href); $("shareBtn").textContent = "コピーしました！"; }
    } catch (_) {}
  };
  // ステージ外(結果画面)でESCで閉じる
  addEventListener("keydown", e => { if (e.key === "Escape" && !busy) stage.className = "stage"; });

  /* ============ 初期化 ============ */
  renderProgress();
  renderCal();
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
